<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Placeholder — add your official UPI QR code here">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3ECDA"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="28" fill="url(#qbg)"/>
  <rect x="10" y="10" width="580" height="580" rx="22" fill="none" stroke="#E3DCC8" stroke-width="2"/>

  <!-- dashed QR frame -->
  <rect x="120" y="110" width="360" height="360" rx="20" fill="#FBF7EE" stroke="#7C9A6E" stroke-width="4" stroke-dasharray="14 12"/>

  <!-- faint QR finder patterns to read as a QR -->
  <g fill="#DCE6D0">
    <rect x="150" y="140" width="80" height="80" rx="10"/>
    <rect x="370" y="140" width="80" height="80" rx="10"/>
    <rect x="150" y="360" width="80" height="80" rx="10"/>
  </g>
  <g fill="#FBF7EE">
    <rect x="168" y="158" width="44" height="44" rx="6"/>
    <rect x="388" y="158" width="44" height="44" rx="6"/>
    <rect x="168" y="378" width="44" height="44" rx="6"/>
  </g>
  <g fill="#C9D8BC">
    <rect x="180" y="170" width="20" height="20" rx="3"/>
    <rect x="400" y="170" width="20" height="20" rx="3"/>
    <rect x="180" y="390" width="20" height="20" rx="3"/>
  </g>
  <!-- scattered faint modules -->
  <g fill="#DCE6D0">
    <rect x="270" y="150" width="18" height="18"/><rect x="300" y="180" width="18" height="18"/>
    <rect x="270" y="210" width="18" height="18"/><rect x="330" y="150" width="18" height="18"/>
    <rect x="270" y="300" width="18" height="18"/><rect x="300" y="330" width="18" height="18"/>
    <rect x="330" y="300" width="18" height="18"/><rect x="360" y="330" width="18" height="18"/>
    <rect x="390" y="300" width="18" height="18"/><rect x="270" y="360" width="18" height="18"/>
    <rect x="330" y="390" width="18" height="18"/><rect x="390" y="360" width="18" height="18"/>
    <rect x="420" y="390" width="18" height="18"/><rect x="420" y="300" width="18" height="18"/>
  </g>

  <!-- upload icon -->
  <circle cx="300" cy="288" r="46" fill="#E8A33D"/>
  <path d="M300 266 l22 24 l-14 0 l0 26 l-16 0 l0 -26 l-14 0 Z" fill="#FFFFFF"/>

  <text x="300" y="518" text-anchor="middle" font-family="'Fraunces','Georgia',serif" font-size="30" fill="#4F6B44">Add your UPI QR here</text>
  <text x="300" y="552" text-anchor="middle" font-family="'Poppins','Segoe UI',sans-serif" font-size="18" fill="#6B7C63">Replace images/qr-placeholder.svg</text>
</svg>
