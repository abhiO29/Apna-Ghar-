<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration of the अपना घर building with an arched entrance, garden and warm sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF1E2"/>
      <stop offset="0.65" stop-color="#F5EFE0"/>
      <stop offset="1" stop-color="#FBF7EE"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3ECDA"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C9A6E"/>
      <stop offset="1" stop-color="#4F6B44"/>
    </linearGradient>
    <linearGradient id="doorglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C56B"/>
      <stop offset="1" stop-color="#E8A33D"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6C56B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F6C56B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="985" cy="180" r="190" fill="url(#sun)"/>
  <circle cx="965" cy="175" r="66" fill="#F6C56B" opacity="0.85"/>
  <!-- soft clouds -->
  <g fill="#FFFFFF" opacity="0.75">
    <ellipse cx="250" cy="150" rx="95" ry="34"/>
    <ellipse cx="330" cy="165" rx="70" ry="28"/>
    <ellipse cx="720" cy="110" rx="80" ry="28"/>
  </g>

  <!-- ground -->
  <rect y="628" width="1200" height="272" fill="#E7EEDF"/>
  <rect y="628" width="1200" height="26" fill="#DCE6D0"/>
  <!-- path to door -->
  <path d="M520 900 L560 654 L640 654 L680 900 Z" fill="#EFE7D3"/>
  <path d="M520 900 L560 654 L640 654 L680 900 Z" fill="#E3DCC8" opacity="0.5"/>
  <g stroke="#D8CFB6" stroke-width="3">
    <line x1="546" y1="720" x2="654" y2="720"/>
    <line x1="536" y1="790" x2="664" y2="790"/>
    <line x1="528" y1="860" x2="672" y2="860"/>
  </g>

  <!-- tree (left) -->
  <g>
    <rect x="188" y="470" width="26" height="170" rx="10" fill="#8A6D4B"/>
    <circle cx="201" cy="430" r="86" fill="#7C9A6E"/>
    <circle cx="150" cy="470" r="60" fill="#6E8C61"/>
    <circle cx="252" cy="470" r="60" fill="#8AA87B"/>
    <circle cx="201" cy="490" r="66" fill="#7C9A6E"/>
  </g>
  <!-- shrubs -->
  <g fill="#6E8C61">
    <ellipse cx="330" cy="648" rx="70" ry="34"/>
    <ellipse cx="900" cy="648" rx="80" ry="36"/>
    <ellipse cx="1010" cy="654" rx="60" ry="30"/>
  </g>

  <!-- building shadow -->
  <ellipse cx="600" cy="648" rx="290" ry="30" fill="#34492C" opacity="0.14" filter="url(#soft)"/>

  <!-- main block -->
  <rect x="368" y="300" width="464" height="348" rx="6" fill="url(#wall)" stroke="#E3DCC8" stroke-width="2"/>
  <!-- roof -->
  <path d="M344 300 L600 214 L856 300 Z" fill="url(#roof)"/>
  <path d="M600 214 L856 300 L600 300 Z" fill="#4F6B44" opacity="0.35"/>
  <rect x="356" y="296" width="488" height="14" rx="7" fill="#4F6B44"/>

  <!-- signboard over the arch (the engraved name motif) -->
  <rect x="470" y="330" width="260" height="52" rx="14" fill="#E8A33D"/>
  <rect x="470" y="330" width="260" height="52" rx="14" fill="none" stroke="#C17F1F" stroke-width="2"/>
  <text x="600" y="366" text-anchor="middle" font-family="'Yatra One','Noto Sans Devanagari','Nirmala UI','Mangal',serif" font-size="30" fill="#FFFFFF">अपना घर</text>

  <!-- windows (arch topped) -->
  <g>
    <path d="M410 430 q0 -34 34 -34 q34 0 34 34 l0 70 l-68 0 Z" fill="url(#doorglow)" opacity="0.55"/>
    <path d="M410 430 q0 -34 34 -34 q34 0 34 34 l0 70 l-68 0 Z" fill="none" stroke="#4F6B44" stroke-width="5"/>
    <line x1="444" y1="396" x2="444" y2="500" stroke="#4F6B44" stroke-width="4"/>

    <path d="M722 430 q0 -34 34 -34 q34 0 34 34 l0 70 l-68 0 Z" fill="url(#doorglow)" opacity="0.55"/>
    <path d="M722 430 q0 -34 34 -34 q34 0 34 34 l0 70 l-68 0 Z" fill="none" stroke="#4F6B44" stroke-width="5"/>
    <line x1="756" y1="396" x2="756" y2="500" stroke="#4F6B44" stroke-width="4"/>
  </g>

  <!-- the archway entrance -->
  <path d="M540 648 L540 490 q0 -60 60 -60 q60 0 60 60 l0 158 Z" fill="#3C5233"/>
  <path d="M552 648 L552 494 q0 -48 48 -48 q48 0 48 48 l0 154 Z" fill="url(#doorglow)"/>
  <line x1="600" y1="446" x2="600" y2="648" stroke="#C17F1F" stroke-width="4" opacity="0.6"/>
  <circle cx="582" cy="560" r="5" fill="#4F6B44"/>
  <circle cx="618" cy="560" r="5" fill="#4F6B44"/>

  <!-- steps -->
  <rect x="516" y="640" width="168" height="12" rx="4" fill="#E3DCC8"/>
  <rect x="500" y="652" width="200" height="12" rx="4" fill="#D8CFB6"/>

  <!-- potted marigolds flanking the door -->
  <g>
    <rect x="486" y="606" width="34" height="34" rx="6" fill="#C17F1F"/>
    <circle cx="497" cy="600" r="12" fill="#E8A33D"/><circle cx="512" cy="602" r="11" fill="#F6C56B"/><circle cx="504" cy="590" r="11" fill="#E8A33D"/>
    <rect x="680" y="606" width="34" height="34" rx="6" fill="#C17F1F"/>
    <circle cx="691" cy="600" r="12" fill="#E8A33D"/><circle cx="706" cy="602" r="11" fill="#F6C56B"/><circle cx="698" cy="590" r="11" fill="#E8A33D"/>
  </g>
</svg>
